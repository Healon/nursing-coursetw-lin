name: local-source-freshness

on:
  schedule:
    - cron: "13 1 * * *"  # 每天 09:13 Asia/Taipei（跑在 16:00 本機更新前，健康常態＝昨天成功；避整點壅塞）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_freshness.py
